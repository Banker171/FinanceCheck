name: Diagnose Windows updater
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: FinanceCheck-Windows-x64
          path: release
          github-token: ${{ github.token }}
          run-id: 40206121541
      - run: npm run test:auto-update
